<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Studio ghibli</title>
</head>
<body>
    <header>
        <div>
            <img src="./assets/images/layer1.png" alt="">
        </div>
        <ul id="social-icons">
            <li class="social-icon"><img src="./assets/icons/logo-google.svg" alt="icon-img-google"></li>
            <li class="social-icon"><img src="./assets/icons/logo-facebook.svg" alt="icon-img-facebook"></li>
            <li class="social-icon"><img src="./assets/icons/logo-twitter.svg" alt="icon-img-twitter"></li>
            <li class="social-icon"><img src="./assets/icons/logo-instagram.svg" alt="icon-img-instagram"></li>
        </ul>
    </header>

    <section>
        <div id="hero">
            <div id="hero-text">
                <h3>
                    HAYAO MIYAZAKI
                </h3>
                <h1>
                    A VIAGEM DE CHIHIRO
                </h1>
                <p>
                    Chihiro chega a um mundo mágico dominado por uma bruxa. Aqueles que a desobedecem são transformados em animais.
                </p>
                <div id="hero-buttons">
                    <button class="btn-hero-contained"><i><img src="./assets/icons/Play.svg" alt=""></i>ASSISTIR AGORA</button>
                    <button class="btn-hero">ASSISTA O TRAILER</button>
                </div>
            </div>
            <div>
                <img src="./assets/images/ilustração.png" alt="">
            </div>
        </div>
    </section>
</body>
</html>
